<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de TKPH</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            max-width: 400px; 
            margin: 20px auto; 
            padding: 20px; 
            background-color: #f4f7f6;
        }
        .container {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #2c3e50; margin-top: 0; }
        label { display: block; margin-top: 15px; font-size: 14px; font-weight: bold; color: #34495e; }
        input { 
            width: 100%; 
            padding: 10px; 
            margin-top: 5px; 
            box-sizing: border-box; 
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background-color: #0f766e; 
            color: white; 
            font-size: 16px;
            font-weight: bold;
            border: none; 
            border-radius: 6px; 
            margin-top: 25px; 
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #0d5f58; }
        .result { 
            margin-top: 25px; 
            padding: 15px; 
            background-color: #f8fafc; 
            border: 1px solid #e2e8f0;
            border-radius: 8px; 
            text-align: center; 
            display: none;
        }
        .result p { margin: 8px 0; color: #475569; }
        .result h3 { margin: 15px 0 5px 0; color: #1e293b; font-size: 22px; }
        .alert { 
            color: white; 
            font-weight: bold; 
            padding: 12px; 
            margin-top: 15px; 
            border-radius: 6px; 
        }
        .safe { background-color: #10b981; }
        .danger { background-color: #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Calculadora de TKPH</h2>
        
        <label>Carga no Pneu Vazio (t):</label>
        <input type="number" id="cargaVazio" value="22" step="0.1">
        
        <label>Carga no Pneu Cheio (t):</label>
        <input type="number" id="cargaCheio" value="58" step="0.1">
        
        <label>Distância de Ida e Volta (km):</label>
        <input type="number" id="distancia" value="7.5" step="0.1">
        
        <label>Ciclos por Turno:</label>
        <input type="number" id="ciclos" value="18">
        
        <label>Horas do Turno:</label>
        <input type="number" id="horas" value="12">
        
        <label>TKPH Nominal (Limite do Pneu):</label>
        <input type="number" id="tkphNominal" value="450">
        
        <button onclick="calcularTKPH()">Analisar Dimensionamento</button>
        
        <div class="result" id="resultado">
            <p><strong>Carga Média por Pneu:</strong> <span id="outCarga"></span> t</p>
            <p><strong>Velocidade Média do Turno:</strong> <span id="outVel"></span> km/h</p>
            <h3>TKPH Operacional: <span id="outTkph"></span></h3>
            <div id="status" class="alert"></div>
        </div>
    </div>

    <script>
        function calcularTKPH() {
            // Coleta de dados
            const vazio = parseFloat(document.getElementById('cargaVazio').value);
            const cheio = parseFloat(document.getElementById('cargaCheio').value);
            const dist = parseFloat(document.getElementById('distancia').value);
            const ciclos = parseFloat(document.getElementById('ciclos').value);
            const horas = parseFloat(document.getElementById('horas').value);
            const nominal = parseFloat(document.getElementById('tkphNominal').value);

            // Cálculos matemáticos
            const cargaMedia = (vazio + cheio) / 2;
            const velMedia = (dist * ciclos) / horas;
            const tkphOp = cargaMedia * velMedia;

            // Exibição dos resultados
            document.getElementById('outCarga').innerText = cargaMedia.toFixed(2);
            document.getElementById('outVel').innerText = velMedia.toFixed(2);
            document.getElementById('outTkph').innerText = tkphOp.toFixed(0);

            // Avaliação de Risco Térmico
            const statusDiv = document.getElementById('status');
            if (tkphOp <= nominal) {
                statusDiv.innerText = "OPERAÇÃO SEGURA";
                statusDiv.className = "alert safe";
            } else {
                statusDiv.innerText = "RISCO CRÍTICO DE FALHA TÉRMICA";
                statusDiv.className = "alert danger";
            }

            document.getElementById('resultado').style.display = 'block';
        }
    </script>
</body>
</html>
